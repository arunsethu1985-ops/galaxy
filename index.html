<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GALAXY AI</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="app-shell">

    <!-- =========================
         SIDEBAR
         ========================= -->

    <aside class="sidebar">

      <div class="sidebar-header">

        <button
          class="sidebar-primary"
          data-action="new-chat"
          type="button"
        >
          <span>＋</span>
          <span>New chat</span>
        </button>

      </div>


      <nav class="nav">

        <button
          class="nav-row active"
          data-view="chat"
          type="button"
        >
          <span>◌</span>
          <span>Chat</span>
        </button>

        <button
          class="nav-row"
          data-view="work"
          type="button"
        >
          <span>▦</span>
          <span>Work</span>
        </button>

        <button
          class="nav-row"
          data-view="games"
          type="button"
        >
          <span>♛</span>
          <span>Gaming Center</span>
        </button>

        <button
          class="nav-row"
          data-view="projects"
          type="button"
        >
          <span>▱</span>
          <span>Projects</span>
        </button>

        <button
          class="nav-row"
          data-view="library"
          type="button"
        >
          <span>◫</span>
          <span>Library</span>
        </button>

        <button
          class="nav-row"
          data-view="studio"
          type="button"
        >
          <span>▷</span>
          <span>Create Studio</span>
        </button>

      </nav>


      <div class="sidebar-section">

        <div class="sidebar-label">
          Recent
        </div>

        <div
          id="recentChats"
          class="recent-list"
        ></div>

      </div>


      <div class="sidebar-spacer"></div>


      <div class="sidebar-profile">

        <div class="profile-avatar">
          H
        </div>

        <div class="profile-text">
          <strong>Harshavardhan</strong>
          <span>GALAXY AI</span>
        </div>

      </div>

    </aside>


    <!-- =========================
         MAIN
         ========================= -->

    <main class="main-shell">


      <!-- TOP BAR -->

      <header class="topbar">

        <div class="topbar-left">

          <button
            class="mobile-menu"
            type="button"
            aria-label="Menu"
          >
            ☰
          </button>


          <button
            class="galaxy-model-button"
            type="button"
          >
            GALAXY AI
            <span>⌄</span>
          </button>

        </div>


        <div class="topbar-right">

          <select
            id="aiProvider"
            aria-label="AI provider"
          >
            <option value="gemini" selected>
              Gemini
            </option>

            <option value="openai">
              OpenAI
            </option>
          </select>


          <span
            class="status-dot"
            title="Online"
          ></span>

        </div>

      </header>


      <!-- =========================
           CHAT VIEW
           ========================= -->

      <section
        id="chatView"
        class="view active-view"
      >

        <div class="chat-container">


          <!-- EMPTY HOME SCREEN -->

          <div
            id="chatEmpty"
            class="empty-state"
          >

            <div class="empty-content">

              <div class="empty-logo">
                ✦
              </div>

              <h1>
                What can I help with?
              </h1>

            </div>

          </div>


          <!-- CHAT MESSAGES -->

          <div
            id="messages"
            class="messages"
          ></div>


          <!-- =====================
               COMPOSER
               ===================== -->

          <div class="composer-dock">

            <div
              id="attachmentTray"
              class="attachment-tray"
            ></div>


            <div
              id="composer"
              class="composer"
            >

              <textarea
                id="promptInput"
                rows="1"
                maxlength="50000"
                placeholder="Ask anything"
                aria-label="Message GALAXY AI"
              ></textarea>


              <div class="composer-bottom">


                <div class="composer-left">

                  <button
                    class="composer-icon"
                    data-action="attach"
                    type="button"
                    title="Add files"
                  >
                    ＋
                  </button>


                  <button
                    class="composer-tool"
                    data-action="web-search"
                    type="button"
                  >
                    ⌕
                    <span>Search</span>
                  </button>


                  <button
                    class="composer-tool"
                    data-action="image"
                    type="button"
                  >
                    ◫
                    <span>Image</span>
                  </button>


                  <button
                    class="composer-tool"
                    data-action="video"
                    type="button"
                  >
                    ▷
                    <span>Video</span>
                  </button>

                </div>


                <div class="composer-right">

                  <button
                    class="composer-icon"
                    data-action="voice"
                    type="button"
                    title="Voice"
                  >
                    ◉
                  </button>


                  <button
                    id="sendButton"
                    class="send-arrow"
                    data-action="send"
                    type="button"
                    aria-label="Send"
                    title="Send"
                  >
                    ↑
                  </button>

                </div>

              </div>

            </div>


            <div class="composer-footer">

              <span id="draftState">
                Ready
              </span>

              <span>
                GALAXY can make mistakes. Check important information.
              </span>

            </div>

          </div>

        </div>

      </section>


      <!-- =========================
           WORK VIEW
           ========================= -->

      <section
        id="workView"
        class="view"
      >

        <div class="page">

          <div class="page-head">

            <div>
              <span class="eyebrow">
                WORK
              </span>

              <h1>
                Work with GALAXY
              </h1>

              <p>
                Create, edit and improve your work.
              </p>
            </div>

          </div>


          <div class="work-grid">

            <div class="panel">

              <h3>
                Work request
              </h3>


              <textarea
                id="workPrompt"
                class="large-textarea"
                placeholder="Tell GALAXY what you want to create..."
              ></textarea>


              <button
                class="primary-btn"
                data-action="send-work"
                type="button"
              >
                Run with GALAXY
              </button>

            </div>


            <div class="panel">

              <h3>
                Output
              </h3>

              <div
                id="workOutput"
                class="work-output"
              >
                Your work output will appear here.
              </div>

            </div>

          </div>

        </div>

      </section>


      <!-- =========================
           CONTENT VIEW

           Games
           Projects
           Library
           Create Studio
           ========================= -->

      <section
        id="contentView"
        class="view"
      >

        <div class="content-shell">

          <div class="content-head">

            <div>

              <span
                id="contentEyebrow"
                class="eyebrow"
              >
                GALAXY
              </span>


              <h1 id="contentTitle">
                Workspace
              </h1>

            </div>

          </div>


          <div
            id="contentBody"
            class="content-body"
          ></div>

        </div>

      </section>


    </main>

  </div>


  <!-- FILE INPUT -->

  <input
    id="fileInput"
    type="file"
    multiple
    hidden
  />


  <!-- TOAST -->

  <div
    id="toastRoot"
    class="toast-root"
  ></div>


  <!-- JAVASCRIPT -->

  <script src="script.js"></script>

</body>
</html>
