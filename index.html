<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0b0d10"
  >

  <meta
    name="color-scheme"
    content="dark light"
  >

  <meta
    name="description"
    content="GALAXY AI — chat, work, gaming, projects, library, packs, images, sites, GPTs and AI tools."
  >

  <title>GALAXY AI</title>

  <link rel="stylesheet" href="style.css">
</head>


<body>

  <div
    id="app"
    class="app-shell"
  >


    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside
      id="sidebar"
      class="sidebar"
      aria-label="GALAXY navigation"
    >


      <!-- SIDEBAR HEADER -->

      <div class="sidebar-header">


        <button
          class="brand"
          data-action="home"
          type="button"
          aria-label="GALAXY AI home"
        >

          <span class="brand-mark">
            ✦
          </span>

          <span class="brand-name">
            GALAXY AI
          </span>

          <span class="brand-caret">
            ⌄
          </span>

        </button>


        <button
          class="icon-btn sidebar-close"
          data-action="toggle-sidebar"
          type="button"
          aria-label="Close sidebar"
        >
          ‹
        </button>


      </div>



      <!-- =====================================================
           MAIN SIDEBAR NAVIGATION
      ====================================================== -->

      <nav
        class="sidebar-nav"
        aria-label="Main navigation"
      >


        <!-- NEW CHAT -->

        <button
          class="nav-row"
          data-action="new-chat"
          type="button"
        >

          <span class="nav-icon">
            ＋
          </span>

          <span class="nav-label">
            New chat
          </span>

        </button>



        <!-- SEARCH -->

        <button
          class="nav-row"
          data-action="search"
          type="button"
        >

          <span class="nav-icon">
            ⌕
          </span>

          <span class="nav-label">
            Search
          </span>

          <span class="nav-key">
            Ctrl K
          </span>

        </button>



        <div class="nav-gap"></div>



        <!-- GAMING CENTER -->

        <button
          class="nav-row"
          data-view="games"
          type="button"
        >

          <span class="nav-icon">
            ♛
          </span>

          <span class="nav-label">
            Gaming Center
          </span>

          <span class="nav-arrow">
            ›
          </span>

        </button>



        <!-- PROJECTS -->

        <button
          class="nav-row"
          data-view="projects"
          type="button"
        >

          <span class="nav-icon">
            ▱
          </span>

          <span class="nav-label">
            Projects
          </span>

          <span class="nav-arrow">
            ›
          </span>

        </button>



        <!-- LIBRARY -->

        <button
          class="nav-row"
          data-view="library"
          type="button"
        >

          <span class="nav-icon">
            ▣
          </span>

          <span class="nav-label">
            Library
          </span>

          <span class="nav-arrow">
            ›
          </span>

        </button>



        <!-- SCHEDULED -->

        <button
          class="nav-row"
          data-view="scheduled"
          type="button"
        >

          <span class="nav-icon">
            ◷
          </span>

          <span class="nav-label">
            Scheduled
          </span>

          <span class="nav-arrow">
            ›
          </span>

        </button>



        <!-- PLUGINS -->

        <button
          class="nav-row"
          data-view="plugins"
          type="button"
        >

          <span class="nav-icon">
            ◉
          </span>

          <span class="nav-label">
            Plugins
          </span>

          <span class="nav-arrow">
            ›
          </span>

        </button>



        <!-- =====================================================
             MORE
        ====================================================== -->

        <div class="more-wrap">


          <button
            class="nav-row"
            data-action="toggle-more"
            type="button"
            aria-expanded="false"
            aria-controls="moreMenu"
          >

            <span class="nav-icon">
              ⋯
            </span>

            <span class="nav-label">
              More
            </span>

            <span class="nav-arrow">
              ›
            </span>

          </button>



          <div
            id="moreMenu"
            class="more-menu"
            hidden
          >


            <button
              class="menu-row"
              data-view="packs"
              type="button"
            >

              <span class="menu-icon">
                ▦
              </span>

              <span>
                Packs
              </span>

            </button>



            <button
              class="menu-row"
              data-view="images"
              type="button"
            >

              <span class="menu-icon">
                ◫
              </span>

              <span>
                Images
              </span>

            </button>



            <button
              class="menu-row"
              data-view="sites"
              type="button"
            >

              <span class="menu-icon">
                ⌘
              </span>

              <span>
                Sites
              </span>

            </button>



            <button
              class="menu-row"
              data-view="gpts"
              type="button"
            >

              <span class="menu-icon">
                ✧
              </span>

              <span>
                GPTs
              </span>

            </button>



            <button
              class="menu-row"
              data-view="tools"
              type="button"
            >

              <span class="menu-icon">
                ⌁
              </span>

              <span>
                Tools
              </span>

            </button>


          </div>


        </div>


      </nav>



      <!-- =====================================================
           RECENT CHATS
      ====================================================== -->

      <section
        class="recent-section"
        aria-label="Recent chats"
      >

        <div class="section-label">
          Recent
        </div>

        <div
          id="recentChats"
          class="recent-list"
        ></div>

      </section>



      <!-- =====================================================
           PROFILE
      ====================================================== -->

      <div class="sidebar-footer">


        <button
          class="profile-row"
          data-action="settings"
          type="button"
        >

          <span class="avatar">
            G
          </span>


          <span class="profile-copy">

            <strong>
              GALAXY
            </strong>

            <small>
              Personal workspace
            </small>

          </span>


          <span class="nav-arrow">
            ›
          </span>

        </button>


      </div>


    </aside>



    <!-- =====================================================
         MAIN APP
    ====================================================== -->

    <main class="main-shell">



      <!-- =====================================================
           TOP BAR
      ====================================================== -->

      <header class="topbar">


        <div class="topbar-left">


          <button
            class="icon-btn sidebar-open"
            data-action="toggle-sidebar"
            type="button"
            aria-label="Open sidebar"
          >
            ☰
          </button>



          <button
            class="top-brand"
            data-action="home"
            type="button"
          >

            <span>
              GALAXY AI
            </span>

            <span class="top-brand-arrow">
              ⌄
            </span>

          </button>


        </div>



        <!-- CHAT / WORK -->

        <div
          class="mode-tabs"
          role="tablist"
          aria-label="GALAXY modes"
        >


          <button
            class="mode-tab active"
            data-mode="chat"
            type="button"
            role="tab"
            aria-selected="true"
          >
            Chat
          </button>


          <button
            class="mode-tab"
            data-mode="work"
            type="button"
            role="tab"
            aria-selected="false"
          >
            Work
          </button>


        </div>



        <div class="topbar-right">


          <button
            class="icon-btn"
            data-action="command"
            type="button"
            title="Commands"
            aria-label="Commands"
          >
            ⌘
          </button>



          <button
            class="icon-btn"
            data-action="focus"
            type="button"
            title="Focus mode"
            aria-label="Focus mode"
          >
            ◌
          </button>



          <button
            class="icon-btn notification-button"
            data-action="notifications"
            type="button"
            title="Notifications"
            aria-label="Notifications"
          >

            ◔

            <span class="notification-dot"></span>

          </button>



          <button
            class="icon-btn"
            data-action="share"
            type="button"
            title="Share"
            aria-label="Share"
          >
            ↗
          </button>


        </div>


      </header>



      <!-- =====================================================
           CHAT VIEW
      ====================================================== -->

      <section
        id="chatView"
        class="view active-view"
      >


        <div
          id="chatScroller"
          class="chat-scroller"
        >


          <!-- EMPTY CHAT -->

          <section
            id="emptyState"
            class="empty-state"
          >


            <div class="empty-logo">
              ✦
            </div>


            <h1>
              What can I help with?
            </h1>


          </section>



          <!-- MESSAGES -->

          <div
            id="messages"
            class="messages"
            aria-live="polite"
          ></div>


        </div>



        <!-- AI THINKING / TOOL STATUS -->

        <div
          id="toolActivity"
          class="tool-activity"
          hidden
        >

          <span class="tool-activity-spinner"></span>

          <span id="toolActivityText">
            Thinking…
          </span>

        </div>



        <!-- =====================================================
             COMPOSER
        ====================================================== -->

        <div class="composer-dock">



          <!-- DROP FILE -->

          <div
            id="dropHint"
            class="drop-hint"
          >

            <span class="drop-icon">
              ＋
            </span>

            <span>
              Drop files here
            </span>

          </div>



          <!-- ATTACHMENTS -->

          <div
            id="attachmentStrip"
            class="attachment-strip"
            hidden
          ></div>



          <!-- MESSAGE BOX -->

          <div
            id="composer"
            class="composer"
          >


            <!-- ADD FILE -->

            <button
              class="composer-icon composer-plus"
              data-action="attach"
              type="button"
              title="Add files"
              aria-label="Add files"
            >
              ＋
            </button>



            <!-- AI PROVIDER -->

            <select
              id="aiProvider"
              class="ai-provider-select"
              aria-label="AI provider"
            >

              <option value="gemini" selected>
                GALAXY
              </option>

              <option value="openai">
                OpenAI
              </option>

            </select>



            <!-- PROMPT -->

            <textarea
              id="promptInput"
              rows="1"
              maxlength="50000"
              placeholder="Ask anything"
              aria-label="Message GALAXY AI"
              autocomplete="off"
              spellcheck="true"
            ></textarea>



            <!-- WEB SEARCH -->

            <button
              class="composer-icon"
              data-action="web-search"
              type="button"
              title="Search the web"
              aria-label="Search the web"
            >
              ⌕
            </button>



            <!-- IMAGE -->

            <button
              class="composer-icon"
              data-action="image"
              type="button"
              title="Create image"
              aria-label="Create image"
            >
              ◫
            </button>



            <!-- VIDEO -->

            <button
              class="composer-icon"
              data-action="video"
              type="button"
              title="Create video"
              aria-label="Create video"
            >
              ▷
            </button>



            <!-- VOICE -->

            <button
              class="composer-icon voice-button"
              data-action="voice"
              type="button"
              title="Voice"
              aria-label="Voice"
            >

              <span class="voice-idle-icon">
                ◉
              </span>

              <span class="voice-recording-icon">
                ■
              </span>

            </button>



            <!-- SEND -->

            <button
              id="sendButton"
              class="send-arrow"
              data-action="send"
              type="button"
              title="Send"
              aria-label="Send"
            >
              ↑
            </button>


          </div>



          <!-- COMPOSER FOOTER -->

          <div class="composer-footer">


            <span id="draftState">
              Ready
            </span>


            <span class="composer-hint">
              GALAXY can make mistakes. Check important information.
            </span>


          </div>


        </div>


      </section>



      <!-- =====================================================
           WORK VIEW
      ====================================================== -->

      <section
        id="workView"
        class="view"
      >


        <div class="workbench">



          <!-- =================================================
               WORK CHAT
          ================================================== -->

          <section class="work-chat-pane">


            <header class="pane-head">


              <div class="pane-title">

                <span class="pane-title-icon">
                  ✦
                </span>

                <span>
                  GALAXY
                </span>

              </div>


              <span class="live-status">
                Work
              </span>


            </header>



            <div
              id="workMessages"
              class="work-messages"
            ></div>



            <div class="work-composer">


              <textarea
                id="workPrompt"
                rows="1"
                placeholder="Ask GALAXY to change the work..."
                aria-label="GALAXY work request"
              ></textarea>


              <button
                class="send-arrow"
                data-action="send-work"
                type="button"
                title="Send"
                aria-label="Send work request"
              >
                ↑
              </button>


            </div>


          </section>



          <!-- SPLITTER -->

          <div
            id="workSplitter"
            class="splitter"
            role="separator"
            tabindex="0"
            aria-label="Resize work panels"
          ></div>



          <!-- =================================================
               PREVIEW
          ================================================== -->

          <section class="preview-pane">


            <header class="pane-head">



              <div class="preview-tabs">


                <button
                  class="preview-tab active"
                  data-preview="preview"
                  type="button"
                >
                  Preview
                </button>


                <button
                  class="preview-tab"
                  data-preview="code"
                  type="button"
                >
                  Code
                </button>


                <button
                  class="preview-tab"
                  data-preview="files"
                  type="button"
                >
                  Files
                </button>


              </div>



              <div class="pane-actions">


                <button
                  class="icon-btn"
                  data-action="refresh-preview"
                  type="button"
                  title="Refresh preview"
                  aria-label="Refresh preview"
                >
                  ↻
                </button>


                <button
                  class="icon-btn"
                  data-action="fullscreen-preview"
                  type="button"
                  title="Fullscreen preview"
                  aria-label="Fullscreen preview"
                >
                  ⛶
                </button>


              </div>


            </header>



            <div
              id="previewSurface"
              class="preview-surface"
            >


              <div class="preview-empty">


                <span class="preview-empty-icon">
                  ✦
                </span>


                <h2>
                  Work on anything
                </h2>


                <p>
                  Documents, websites, code, plans and creative work.
                </p>


              </div>


            </div>


          </section>


        </div>


      </section>



      <!-- =====================================================
           CONTENT VIEW
           
           Gaming Center
           Projects
           Library
           Scheduled
           Plugins
           Packs
           Images
           Sites
           GPTs
           Tools

           Snake + Chicken are rendered here by script.js.
      ====================================================== -->

      <section
        id="contentView"
        class="view"
      >


        <div class="content-shell">



          <!-- CONTENT HEADER -->

          <header class="content-head">


            <div class="content-heading">


              <p
                id="contentEyebrow"
                class="content-eyebrow"
              >
                Workspace
              </p>


              <h1 id="contentTitle">
                GALAXY
              </h1>


            </div>



            <div
              id="contentActions"
              class="content-actions"
            ></div>


          </header>



          <!-- CONTENT TABS -->

          <div
            id="contentTabs"
            class="flat-tabs"
          ></div>



          <!--
            IMPORTANT:

            Gaming Center including:

            Chess
            Tic-Tac-Toe
            Connect Four
            Memory
            GALAXY Shooting
            Snake
            Chicken

            should be generated by script.js
            inside this contentBody.

            Do not duplicate game boards in index.html.
          -->

          <div
            id="contentBody"
            class="content-body"
          ></div>


        </div>


      </section>


    </main>


  </div>



  <!-- =====================================================
       FILE INPUTS
  ====================================================== -->


  <!-- GENERAL FILE -->

  <input
    id="fileInput"
    type="file"
    multiple
    hidden
  >



  <!-- IMAGE -->

  <input
    id="imageInput"
    type="file"
    accept="image/*"
    multiple
    hidden
  >



  <!-- VIDEO -->

  <input
    id="videoInput"
    type="file"
    accept="video/*"
    multiple
    hidden
  >



  <!-- IMPORT CONVERSATION -->

  <input
    id="conversationImportInput"
    type="file"
    accept=".json,.galaxy.json,application/json"
    hidden
  >



  <!-- LIBRARY -->

  <input
    id="libraryInput"
    type="file"
    accept="image/*,video/*,.pdf,.txt,.md,.doc,.docx,.csv,.json,.html,.css,.js"
    multiple
    hidden
  >



  <!-- =====================================================
       GLOBAL ROOTS
  ====================================================== -->


  <div id="overlayRoot"></div>


  <div
    id="contextMenuRoot"
    class="context-menu-root"
  ></div>


  <div
    id="toastRoot"
    class="toast-root"
  ></div>



  <!-- MOBILE SIDEBAR BACKDROP -->

  <button
    id="sidebarBackdrop"
    class="sidebar-backdrop"
    data-action="toggle-sidebar"
    type="button"
    aria-label="Close sidebar"
    hidden
  ></button>



  <!-- ACCESSIBILITY STATUS -->

  <div
    id="statusRegion"
    class="sr-only"
    aria-live="polite"
  ></div>



  <!-- =====================================================
       GALAXY JAVASCRIPT
  ====================================================== -->

  <script src="script.js"></script>


</body>

</html>
