<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="GALAXY AI Assistant"
  />

  <title>GALAXY AI</title>

  <link
    rel="stylesheet"
    href="style.css"
  />
</head>


<body>

  <div class="app-shell">


    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <aside class="sidebar">


      <!-- BRAND -->

      <div class="brand">

        <div class="brand-mark">
          ✦
        </div>

        <div>
          <strong>GALAXY AI</strong>
          <span>AI Assistant</span>
        </div>

      </div>


      <!-- NEW CHAT -->

      <button
        class="sidebar-primary"
        data-action="new-chat"
        type="button"
      >
        ＋ New chat
      </button>


      <!-- MAIN NAVIGATION -->

      <nav class="nav">


        <button
          class="nav-row active"
          data-view="chat"
          type="button"
        >
          <span>◌</span>
          Chat
        </button>


        <button
          class="nav-row"
          data-view="work"
          type="button"
        >
          <span>▦</span>
          Work
        </button>


        <button
          class="nav-row"
          data-view="games"
          type="button"
        >
          <span>♛</span>
          Gaming Center
        </button>


        <button
          class="nav-row"
          data-view="projects"
          type="button"
        >
          <span>▱</span>
          Projects
        </button>


        <button
          class="nav-row"
          data-view="library"
          type="button"
        >
          <span>◫</span>
          Library
        </button>


        <button
          class="nav-row"
          data-view="studio"
          type="button"
        >
          <span>▷</span>
          Create Studio
        </button>


      </nav>


      <!-- PUSH RECENTS DOWN -->

      <div class="sidebar-spacer"></div>


      <!-- RECENT CHATS -->

      <div class="sidebar-section">

        <span class="sidebar-label">
          RECENT
        </span>

        <div
          id="recentChats"
          class="recent-list"
        ></div>

      </div>


    </aside>



    <!-- =====================================================
         MAIN AREA
         ===================================================== -->

    <main class="main-shell">


      <!-- ===================================================
           TOP BAR
           =================================================== -->

      <header class="topbar">


        <div class="mode-tabs">

          <button
            class="mode-tab active"
            data-view="chat"
            type="button"
          >
            Chat
          </button>


          <button
            class="mode-tab"
            data-view="work"
            type="button"
          >
            Work
          </button>


          <button
            class="mode-tab"
            data-view="games"
            type="button"
          >
            Games
          </button>

        </div>


        <div class="topbar-right">


          <select
            id="aiProvider"
            aria-label="AI provider"
          >

            <option
              value="gemini"
              selected
            >
              GALAXY
            </option>

            <option value="openai">
              OpenAI
            </option>

          </select>


          <span
            class="status-dot"
            title="GALAXY Online"
          ></span>


        </div>


      </header>



      <!-- ===================================================
           CHAT VIEW
           =================================================== -->

      <section
        id="chatView"
        class="view active-view"
      >


        <!-- EMPTY START SCREEN -->

        <div
          id="chatEmpty"
          class="empty-state"
        >


          <div class="empty-logo">
            ✦
          </div>


          <h1>
            What can I help with?
          </h1>


          <p>
            Ask GALAXY anything.
          </p>


        </div>



        <!-- CHAT MESSAGES -->

        <div
          id="messages"
          class="messages"
          aria-live="polite"
        ></div>



        <!-- =================================================
             CHAT COMPOSER
             ================================================= -->

        <div class="composer-dock">


          <!-- ATTACHMENTS -->

          <div
            id="attachmentTray"
            class="attachment-tray"
          ></div>



          <!-- MESSAGE BOX -->

          <div
            id="composer"
            class="composer"
          >


            <!-- ATTACH -->

            <button
              class="composer-icon"
              data-action="attach"
              type="button"
              title="Add files"
              aria-label="Add files"
            >
              ＋
            </button>



            <!-- INPUT -->

            <textarea
              id="promptInput"
              rows="1"
              maxlength="50000"
              placeholder="Message GALAXY"
              aria-label="Message GALAXY AI"
            ></textarea>



            <!-- SEARCH -->

            <button
              class="composer-icon"
              data-action="web-search"
              type="button"
              title="Search the web"
              aria-label="Search the web"
            >
              ⌕
            </button>



            <!-- IMAGE -->

            <button
              class="composer-icon"
              data-action="image"
              type="button"
              title="Create image"
              aria-label="Create image"
            >
              ◫
            </button>



            <!-- VIDEO -->

            <button
              class="composer-icon"
              data-action="video"
              type="button"
              title="Create video"
              aria-label="Create video"
            >
              ▷
            </button>



            <!-- VOICE -->

            <button
              class="composer-icon"
              data-action="voice"
              type="button"
              title="Voice"
              aria-label="Voice"
            >
              ◉
            </button>



            <!-- SEND -->

            <button
              id="sendButton"
              class="send-arrow"
              data-action="send"
              type="button"
              title="Send"
              aria-label="Send"
            >
              ↑
            </button>


          </div>



          <!-- FOOTER -->

          <div class="composer-footer">

            <span id="draftState">
              Ready
            </span>

            <span>
              GALAXY can make mistakes. Check important information.
            </span>

          </div>


        </div>


      </section>



      <!-- ===================================================
           WORK VIEW
           =================================================== -->

      <section
        id="workView"
        class="view"
      >


        <div class="page">


          <div class="page-head">

            <div>

              <span class="eyebrow">
                GALAXY WORK
              </span>


              <h1>
                Work with GALAXY
              </h1>


              <p>
                Create, edit and improve your work.
              </p>

            </div>


          </div>



          <div class="work-grid">


            <!-- REQUEST -->

            <div class="panel">


              <h3>
                Work request
              </h3>


              <textarea
                id="workPrompt"
                class="large-textarea"
                placeholder="Tell GAL
