<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0b0d10"
  >

  <meta
    name="color-scheme"
    content="dark light"
  >

  <meta
    name="description"
    content="GALAXY AI — chat, work, projects, library, packs, images, sites, GPTs and AI tools."
  >

  <title>GALAXY AI</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>


<body>

  <!-- ======================================================
       GALAXY AI
       MAIN APPLICATION
  ======================================================= -->

  <div
    id="app"
    class="app-shell"
  >


    <!-- ====================================================
         SIDEBAR
    ===================================================== -->

    <aside
      id="sidebar"
      class="sidebar"
      aria-label="GALAXY navigation"
    >


      <!-- ==================================================
           SIDEBAR TOP
      =================================================== -->

      <div class="sidebar-header">


        <!-- BRAND -->

        <button
          class="brand"
          data-action="home"
          aria-label="GALAXY AI home"
        >

          <span
            class="brand-mark"
            aria-hidden="true"
          >
            ✦
          </span>

          <span class="brand-name">
            GALAXY AI
          </span>

          <span
            class="brand-caret"
            aria-hidden="true"
          >
            ⌄
          </span>

        </button>


        <!-- CLOSE SIDEBAR -->

        <button
          class="icon-btn sidebar-close"
          data-action="toggle-sidebar"
          aria-label="Close sidebar"
          title="Close sidebar"
        >
          ‹
        </button>

      </div>



      <!-- ==================================================
           PRIMARY NAVIGATION
      =================================================== -->

      <nav
        class="sidebar-nav"
        aria-label="Main navigation"
      >


        <!-- NEW CHAT -->

        <button
          class="nav-row"
          data-action="new-chat"
        >

          <span
            class="nav-icon"
            aria-hidden="true"
          >
            ＋
          </span>

          <span class="nav-label">
            New chat
          </span>

        </button>



        <!-- SEARCH -->

        <button
          class="nav-row"
          data-action="search"
        >

          <span
            class="nav-icon"
            aria-hidden="true"
          >
            ⌕
          </span>

          <span class="nav-label">
            Search
          </span>

          <span class="nav-key">
            Ctrl K
          </span>

        </button>



        <div
          class="nav-gap"
          aria-hidden="true"
        ></div>



        <!-- PROJECTS -->

        <button class="nav-row" data-view="studio" aria-label="Create Studio">
          <span class="nav-icon" aria-hidden="true">✦</span>
          <span class="nav-label">Create Studio</span>
          <span class="nav-arrow" aria-hidden="true">›</span>
        </button>

        <button
          class="nav-row"
          data-view="projects"
        >

          <span
            class="nav-icon"
            aria-hidden="true"
          >
            ▱
          </span>

          <span class="nav-label">
            Projects
          </span>

          <span
            class="nav-arrow"
            aria-hidden="true"
          >
            ›
          </span>

        </button>



        <!-- LIBRARY -->

        <button
          class="nav-row"
          data-view="library"
        >

          <span
            class="nav-icon"
            aria-hidden="true"
          >
            ▣
          </span>

          <span class="nav-label">
            Library
          </span>

          <span
            class="nav-arrow"
            aria-hidden="true"
          >
            ›
          </span>

        </button>



        <!-- SCHEDULED -->

        <button
          class="nav-row"
          data-view="scheduled"
        >

          <span
            class="nav-icon"
            aria-hidden="true"
          >
            ◷
          </span>

          <span class="nav-label">
            Scheduled
          </span>

          <span
            class="nav-arrow"
            aria-hidden="true"
          >
            ›
          </span>

        </button>



        <!-- PLUGINS -->

        <button
          class="nav-row"
          data-view="plugins"
        >

          <span
            class="nav-icon"
            aria-hidden="true"
          >
            ◉
          </span>

          <span class="nav-label">
            Plugins
          </span>

          <span
            class="nav-arrow"
            aria-hidden="true"
          >
            ›
          </span>

        </button>



        <!-- PACKS -->

        <button
          class="nav-row"
          data-view="packs"
        >

          <span
            class="nav-icon"
            aria-hidden="true"
          >
            ▦
          </span>

          <span class="nav-label">
            Packs
          </span>

          <span
            class="nav-arrow"
            aria-hidden="true"
          >
            ›
          </span>

        </button>


        <!-- GAMING CENTER -->

        <button
          class="nav-row"
          data-view="games"
        >

          <span
            class="nav-icon"
            aria-hidden="true"
          >
            ♟
          </span>

          <span class="nav-label">
            Gaming Center
          </span>

          <span
            class="nav-arrow"
            aria-hidden="true"
          >
            ›
          </span>

        </button>



        <!-- ==================================================
             MORE
        =================================================== -->

        <div class="more-wrap">


          <button
            class="nav-row"
            data-action="toggle-more"
            aria-expanded="false"
            aria-controls="moreMenu"
          >

            <span
              class="nav-icon"
              aria-hidden="true"
            >
              ⋯
            </span>

            <span class="nav-label">
              More
            </span>

            <span
              class="nav-arrow"
              aria-hidden="true"
            >
              ›
            </span>

          </button>



          <!-- MORE MENU -->

          <div
            id="moreMenu"
            class="more-menu"
            hidden
          >


            <!-- PACKS -->

            <button
              class="menu-row"
              data-view="packs"
            >

              <span
                class="menu-icon"
                aria-hidden="true"
              >
                ▦
              </span>

              <span>
                Packs
              </span>

            </button>



            <!-- IMAGES -->

            <button
              class="menu-row"
              data-view="images"
            >

              <span
                class="menu-icon"
                aria-hidden="true"
              >
                ◫
              </span>

              <span>
                Images
              </span>

            </button>



            <!-- SITES -->

            <button
              class="menu-row"
              data-view="sites"
            >

              <span
                class="menu-icon"
                aria-hidden="true"
              >
                ⌘
              </span>

              <span>
                Sites
              </span>

            </button>



            <!-- GPTS -->

            <button
              class="menu-row"
              data-view="gpts"
            >

              <span
                class="menu-icon"
                aria-hidden="true"
              >
                ✧
              </span>

              <span>
                GPTs
              </span>

            </button>



            <!-- TOOLS -->

            <button
              class="menu-row"
              data-view="tools"
            >

              <span
                class="menu-icon"
                aria-hidden="true"
              >
                ⌁
              </span>

              <span>
                Tools
              </span>

            </button>

          </div>

        </div>

      </nav>



      <!-- ==================================================
           RECENT CHATS
      =================================================== -->

      <section
        class="recent-section"
        aria-label="Recent chats"
      >

        <div class="section-label">
          Recent
        </div>

        <div
          id="recentChats"
          class="recent-list"
        ></div>

      </section>



      <!-- ==================================================
           SIDEBAR PROFILE
      =================================================== -->

      <div class="sidebar-footer">


        <button
          class="profile-row"
          data-action="settings"
        >

          <span
            class="avatar"
            aria-hidden="true"
          >
            G
          </span>


          <span class="profile-copy">

            <strong>
              GALAXY
            </strong>

            <small>
              Personal workspace
            </small>

          </span>


          <span
            class="nav-arrow"
            aria-hidden="true"
          >
            ›
          </span>

        </button>

      </div>

    </aside>



    <!-- ====================================================
         MAIN SHELL
    ===================================================== -->

    <main class="main-shell">


      <!-- ==================================================
           TOP BAR
      =================================================== -->

      <header class="topbar">


        <!-- TOP LEFT -->

        <div class="topbar-left">


          <button
            class="icon-btn sidebar-open"
            data-action="toggle-sidebar"
            aria-label="Open sidebar"
            title="Open sidebar"
          >
            ☰
          </button>


          <button
            class="top-brand"
            data-action="home"
          >

            <span>
              GALAXY AI
            </span>

            <span
              class="top-brand-arrow"
              aria-hidden="true"
            >
              ⌄
            </span>

          </button>

        </div>



        <!-- ==================================================
             CHAT / WORK
        =================================================== -->

        <div
          class="mode-tabs"
          role="tablist"
          aria-label="GALAXY mode"
        >


          <button
            class="mode-tab active"
            data-mode="chat"
            role="tab"
            aria-selected="true"
          >
            Chat
          </button>


          <button
            class="mode-tab"
            data-mode="work"
            role="tab"
            aria-selected="false"
          >
            Work
          </button>

        </div>



        <!-- TOP RIGHT -->

        <div class="topbar-right">


          <!-- COMMAND PALETTE -->

          <button
            class="icon-btn"
            data-action="command"
            aria-label="Command palette"
            title="Command palette"
          >
            ⌘
          </button>



          <!-- FOCUS -->

          <button
            class="icon-btn"
            data-action="focus"
            aria-label="Focus mode"
            title="Focus mode"
          >
            ◌
          </button>



          <!-- NOTIFICATIONS -->

          <button
            class="icon-btn notification-button"
            data-action="notifications"
            aria-label="Notifications"
            title="Notifications"
          >

            <span aria-hidden="true">
              ◔
            </span>

            <span
              class="notification-dot"
              aria-hidden="true"
            ></span>

          </button>



          <!-- SHARE -->

          <button
            class="icon-btn"
            data-action="share"
            aria-label="Share"
            title="Share"
          >
            ↗
          </button>

        </div>

      </header>



      <!-- ==================================================
           CHAT VIEW
      =================================================== -->

      <section
        id="chatView"
        class="view active-view"
        aria-label="Chat"
      >


        <!-- CHAT SCROLLER -->

        <div
          id="chatScroller"
          class="chat-scroller"
        >


          <!-- ==================================================
               EMPTY CHAT
          =================================================== -->

          <section
            id="emptyState"
            class="empty-state"
          >


            <div
              class="empty-logo"
              aria-hidden="true"
            >
              ✦
            </div>


            <h1>
              What can I help with?
            </h1>

          </section>



          <!-- ==================================================
               CHAT MESSAGES
          =================================================== -->

          <div
            id="messages"
            class="messages"
            aria-live="polite"
            aria-relevant="additions"
          ></div>

        </div>



        <!-- ==================================================
             TOOL ACTIVITY
        =================================================== -->

        <div
          id="toolActivity"
          class="tool-activity"
          hidden
          aria-live="polite"
        >

          <span
            class="tool-activity-spinner"
            aria-hidden="true"
          ></span>

          <span id="toolActivityText">
            Thinking…
          </span>

        </div>



        <!-- ==================================================
             COMPOSER AREA
        =================================================== -->

        <div class="composer-dock">


          <!-- DRAG AND DROP -->

          <div
            id="dropHint"
            class="drop-hint"
          >

            <span
              class="drop-icon"
              aria-hidden="true"
            >
              ＋
            </span>

            <span>
              Drop files here
            </span>

          </div>



          <!-- ATTACHMENTS -->

          <div
            id="attachmentStrip"
            class="attachment-strip"
            hidden
          ></div>



          <!-- ==================================================
               MAIN MESSAGE BOX
          =================================================== -->

          <div
            id="composer"
            class="composer"
          >


            <!-- PLUS -->

            <button
              class="composer-icon composer-plus"
              data-action="attach"
              aria-label="Add files"
              title="Add files"
            >
              ＋
            </button>

<select
  id="aiProvider"
  class="ai-provider-select"
  aria-label="Choose AI"
>
  <option value="openai">OpenAI</option>
  <option value="gemini">Gemini</option>
</select>

            <!-- MESSAGE -->

            <textarea
              id="promptInput"
              rows="1"
              maxlength="50000"
              placeholder="Ask anything"
              aria-label="Message GALAXY AI"
              autocomplete="off"
              spellcheck="true"
            ></textarea>



            <!-- WEB SEARCH -->

            <button
              class="composer-icon"
              data-action="web-search"
              aria-label="Search the web"
              title="Search the web"
            >
              ⌕
            </button>



            <!-- IMAGE -->

            <button
              class="composer-icon"
              data-action="image"
              aria-label="Add or create image"
              title="Images"
            >
              ◫
            </button>



            <!-- VIDEO -->

            <button
              class="composer-icon"
              data-action="video"
              aria-label="Add or create video"
              title="Videos"
            >
              ▷
            </button>



            <!-- VOICE -->

            <button
              class="composer-icon voice-button"
              data-action="voice"
              aria-label="Voice"
              title="Voice"
            >

              <span
                class="voice-idle-icon"
                aria-hidden="true"
              >
                ◉
              </span>

              <span
                class="voice-recording-icon"
                aria-hidden="true"
              >
                ■
              </span>

            </button>



            <!-- SEND / STOP -->

            <button
              id="sendButton"
              class="send-arrow"
              data-action="send"
              aria-label="Send"
              title="Send"
            >
              ↑
            </button>

          </div>



          <!-- COMPOSER FOOTNOTE -->

          <div class="composer-footer">

            <span id="draftState">
              Ready
            </span>

            <span class="composer-hint">
              GALAXY can make mistakes. Check important information.
            </span>

          </div>

        </div>

      </section>



      <!-- ==================================================
           WORK VIEW
      =================================================== -->

      <section
        id="workView"
        class="view"
        aria-label="Work"
      >


        <div class="workbench">


          <!-- ==================================================
               WORK CHAT PANE
          =================================================== -->

          <section class="work-chat-pane">


            <header class="pane-head">

              <div class="pane-title">

                <span
                  class="pane-title-icon"
                  aria-hidden="true"
                >
                  ✦
                </span>

                <span>
                  GALAXY
                </span>

              </div>


              <span class="live-status">
                Work
              </span>

            </header>



            <div
              id="workMessages"
              class="work-messages"
              aria-live="polite"
            ></div>



            <!-- WORK COMPOSER -->

            <div class="work-composer">

              <textarea
                id="workPrompt"
                rows="1"
                placeholder="Ask GALAXY to change the work..."
                aria-label="Work message"
              ></textarea>


              <button
                class="send-arrow"
                data-action="send-work"
                aria-label="Send work request"
              >
                ↑
              </button>

            </div>

          </section>



          <!-- SPLITTER -->

          <div
            id="workSplitter"
            class="splitter"
            role="separator"
            tabindex="0"
            aria-label="Resize work panels"
          ></div>



          <!-- ==================================================
               WORK PREVIEW PANE
          =================================================== -->

          <section class="preview-pane">


            <header class="pane-head">


              <!-- PREVIEW TABS -->

              <div
                class="preview-tabs"
                role="tablist"
              >


                <button
                  class="preview-tab active"
                  data-preview="preview"
                  role="tab"
                  aria-selected="true"
                >
                  Preview
                </button>


                <button
                  class="preview-tab"
                  data-preview="code"
                  role="tab"
                  aria-selected="false"
                >
                  Code
                </button>


                <button
                  class="preview-tab"
                  data-preview="files"
                  role="tab"
                  aria-selected="false"
                >
                  Files
                </button>

              </div>



              <!-- PREVIEW ACTIONS -->

              <div class="pane-actions">


                <button
                  class="icon-btn"
                  data-action="refresh-preview"
                  aria-label="Refresh preview"
                  title="Refresh"
                >
                  ↻
                </button>


                <button
                  class="icon-btn"
                  data-action="fullscreen-preview"
                  aria-label="Fullscreen preview"
                  title="Fullscreen"
                >
                  ⛶
                </button>

              </div>

            </header>



            <!-- PREVIEW -->

            <div
              id="previewSurface"
              class="preview-surface"
            >


              <div class="preview-empty">

                <span
                  class="preview-empty-icon"
                  aria-hidden="true"
                >
                  ✦
                </span>


                <h2>
                  Work on anything
                </h2>


                <p>
                  Documents, websites, code, plans and creative work.
                </p>

              </div>

            </div>

          </section>

        </div>

      </section>



      <!-- ==================================================
           DYNAMIC CONTENT VIEW

           Projects
           Library
           Scheduled
           Plugins
           Packs
           Images
           Sites
           GPTs
           Tools
      =================================================== -->

      <section
        id="contentView"
        class="view"
        aria-label="Workspace"
      >


        <div class="content-shell">


          <!-- CONTENT HEADER -->

          <header class="content-head">


            <div class="content-heading">

              <p
                id="contentEyebrow"
                class="content-eyebrow"
              >
                Workspace
              </p>


              <h1 id="contentTitle">
                Library
              </h1>

            </div>



            <div
              id="contentActions"
              class="content-actions"
            ></div>

          </header>



          <!-- ==================================================
               CLEAN FLAT TABS
          =================================================== -->

          <div
            id="contentTabs"
            class="flat-tabs"
            role="tablist"
          ></div>



          <!-- CONTENT -->

          <div
            id="contentBody"
            class="content-body"
          ></div>


          <!-- ==================================================
               PACK DETAILS TEMPLATE

               This template is hidden by default.
               script.js can clone and populate it when a Pack
               is opened.
          =================================================== -->

          <template id="packDetailTemplate">

            <section
              class="pack-detail"
              data-pack-detail
            >

              <!-- PACK HERO -->

              <header class="pack-detail-hero">

                <div
                  class="pack-detail-icon"
                  data-pack-detail-icon
                  aria-hidden="true"
                >
                  ✦
                </div>

                <div class="pack-detail-copy">

                  <span class="pack-detail-label">
                    GALAXY Pack
                  </span>

                  <h1 data-pack-detail-name>
                    Pack Name
                  </h1>

                  <p data-pack-detail-description>
                    Pack description
                  </p>

                  <div class="pack-detail-meta">

                    <span data-pack-detail-count>
                      0 workflows
                    </span>

                    <span data-pack-detail-status>
                      Installed
                    </span>

                    <span
                      data-pack-detail-featured
                      hidden
                    >
                      Featured
                    </span>

                  </div>

                </div>

              </header>


              <!-- ABOUT -->

              <section class="pack-detail-section">

                <div class="pack-detail-section-head">

                  <h2>
                    About this Pack
                  </h2>

                </div>

                <p data-pack-detail-about>
                  Learn what this Pack is designed to help you do.
                </p>

              </section>


              <!-- INCLUDED WORKFLOWS -->

              <section class="pack-detail-section">

                <div class="pack-detail-section-head">

                  <h2>
                    Included workflows
                  </h2>

                  <span data-pack-detail-workflow-count>
                    0 included
                  </span>

                </div>

                <div
                  class="pack-workflow-list"
                  data-pack-detail-workflows
                ></div>

              </section>


              <!-- BEST FOR -->

              <section class="pack-detail-section">

                <div class="pack-detail-section-head">

                  <h2>
                    Best for
                  </h2>

                </div>

                <div
                  class="pack-use-grid"
                  data-pack-detail-use-cases
                ></div>

              </section>


              <!-- EXAMPLE PROMPT -->

              <section class="pack-detail-section">

                <div class="pack-detail-section-head">

                  <h2>
                    Example prompt
                  </h2>

                </div>

                <div class="pack-example">

                  <p data-pack-detail-example>
                    Try a workflow from this Pack.
                  </p>

                  <button
                    class="text-action"
                    type="button"
                    data-pack-detail-use-example
                  >
                    Use prompt
                  </button>

                </div>

              </section>


              <!-- PACK ACTIONS -->

              <footer class="pack-detail-actions">

                <button
                  class="text-action"
                  type="button"
                  data-pack-detail-back
                >
                  ← Back to Packs
                </button>

                <button
                  class="text-action primary"
                  type="button"
                  data-pack-detail-install
                >
                  Install Pack
                </button>

              </footer>

            </section>

          </template>

        </div>

      </section>

    </main>

  </div>



  <!-- ======================================================
       FILE INPUTS
  ======================================================= -->


  <!-- GENERAL FILES -->

  <input
    id="fileInput"
    type="file"
    multiple
    hidden
  >



  <!-- IMAGES -->

  <input
    id="imageInput"
    type="file"
    accept="image/*"
    multiple
    hidden
  >



  <!-- VIDEOS -->

  <input
    id="videoInput"
    type="file"
    accept="video/*"
    multiple
    hidden
  >



  <!-- CONVERSATION IMPORT -->

  <input
    id="conversationImportInput"
    type="file"
    accept=".json,.galaxy.json,application/json"
    hidden
  >



  <!-- LIBRARY IMPORT -->

  <input
    id="libraryInput"
    type="file"
    accept="image/*,video/*,.pdf,.txt,.md,.doc,.docx,.csv,.json,.html,.css,.js"
    multiple
    hidden
  >



  <!-- ======================================================
       OVERLAYS
  ======================================================= -->

  <div id="overlayRoot"></div>



  <!-- ======================================================
       CONTEXT MENU ROOT
  ======================================================= -->

  <div
    id="contextMenuRoot"
    class="context-menu-root"
  ></div>



  <!-- ======================================================
       TOASTS
  ======================================================= -->

  <div
    id="toastRoot"
    class="toast-root"
    aria-live="polite"
    aria-atomic="true"
  ></div>



  <!-- ======================================================
       MOBILE BACKDROP
  ======================================================= -->

  <button
    id="sidebarBackdrop"
    class="sidebar-backdrop"
    data-action="toggle-sidebar"
    aria-label="Close sidebar"
    hidden
  ></button>



  <!-- ======================================================
       ACCESSIBILITY STATUS
  ======================================================= -->

  <div
    id="statusRegion"
    class="sr-only"
    aria-live="polite"
  ></div>



  <!-- ======================================================
       JAVASCRIPT
  ======================================================= -->

  <script src="script.js"></script>

</body>

</html>
